name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.4.2'
  BUILD_TYPE: Release
  APP_NAME: Lore
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          arch: 'win64_msvc2019_64'
          cache: true
          modules: 'qt5compat qtmultimedia qtpdf qtwebsockets qtwebchannel qtspeech'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install vcpkg Dependencies
        shell: pwsh
        run: |
          vcpkg install faiss:x64-windows tesseract:x64-windows leptonica:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Install Graphviz, Node.js, tree-sitter CLI, pkg-config, FFmpeg
        shell: pwsh
        run: |
          choco install graphviz -y
          choco install nodejs-lts -y
          choco install pkgconfiglite -y
          choco install ffmpeg -y
          npm install -g @mermaid-js/mermaid-cli tree-sitter-cli

      - name: Set Node.js environment
        shell: pwsh
        run: |
          $npm_bin = npm config get prefix
          echo "NPM_BIN=$npm_bin" >> $env:GITHUB_ENV

      - name: Set pkg-config environment
        shell: pwsh
        run: |
          $pc_path = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib\pkgconfig"
          echo "PKG_CONFIG_PATH=$pc_path" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_EXECUTABLE=$(Get-Command pkg-config).Source" >> $env:GITHUB_ENV

      - name: Locate FFmpeg
        shell: pwsh
        run: |
          $candidates = @(
            "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin",
            "C:\ProgramData\chocolatey\bin"
          )
          foreach ($c in $candidates) {
            if (Test-Path "$c\ffmpeg.exe") {
              echo "FFMPEG_DIR=$c" >> $env:GITHUB_ENV
              break
            }
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          $extraPrefix = ""
          if ($env:FFMPEG_DIR) { $extraPrefix = ";$env:FFMPEG_DIR\.." }
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }};$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows$extraPrefix" `
            -DCMAKE_PROGRAM_PATH="${{ env.QT_ROOT_DIR }}/bin;$env:NPM_BIN;$env:FFMPEG_DIR" `
            -DEPISTEME_NODE_BIN="$env:NPM_BIN"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          windeployqt --release --dir deploy "build\bin\${{ env.APP_NAME }}.exe"

      - name: Copy External Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy/usr/bin | Out-Null
          New-Item -ItemType Directory -Force -Path deploy/usr/share/Lore | Out-Null
          New-Item -ItemType Directory -Force -Path deploy/lib | Out-Null

          Copy-Item "$env:NPM_BIN\node.exe"  deploy/usr/bin/
          Copy-Item "$env:NPM_BIN\mmdc.cmd"  deploy/usr/bin/
          Copy-Item (Get-Command dot).Source deploy/usr/bin/dot.exe

          # FFmpeg DLLs
          if ($env:FFMPEG_DIR) {
            Get-ChildItem "$env:FFMPEG_DIR\*.dll" | Copy-Item -Destination deploy\ -ErrorAction SilentlyContinue
          }

          # vcpkg DLLs must sit next to Lore.exe so the loader finds them.
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" `
            | Copy-Item -Destination deploy\ -ErrorAction SilentlyContinue

          if (Test-Path "cmake-build-libs/install/lib") {
            Copy-Item -Recurse "cmake-build-libs/install/lib/*" deploy/lib/
          }

          # NeMo-Speech.cpp shared libraries (built in-tree)
          if (Test-Path "cmake-build-libs/QF-ML/nemo-speech/bin") {
            Get-ChildItem "cmake-build-libs/QF-ML/nemo-speech/bin\*.dll" `
              | Copy-Item -Destination deploy\ -ErrorAction SilentlyContinue
          }

          if (Test-Path "models") {
            Copy-Item -Recurse models deploy/usr/share/Lore/
          }
          if (Test-Path "external/HeadTTS") {
            Copy-Item -Recurse external/HeadTTS deploy/usr/share/Lore/HeadTTS
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lore-windows-${{ env.BUILD_TYPE }}
          path: deploy/