name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.4.2'
  BUILD_TYPE: Release
  APP_NAME: Lore

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          arch: 'win64_msvc2019_64'
          cache: true
          modules: 'qt5compat qtmultimedia qtpdf qtwebsockets qtwebchannel qttexttospeech'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install vcpkg Dependencies
        shell: pwsh
        run: |
          vcpkg install quazip:x64-windows faiss:x64-windows
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Install Graphviz, Node.js, tree-sitter CLI
        shell: pwsh
        run: |
          choco install graphviz -y
          choco install nodejs-lts -y
          npm install -g @mermaid-js/mermaid-cli tree-sitter-cli

      - name: Set Node.js environment
        shell: pwsh
        run: |
          $npm_bin = npm config get prefix
          echo "NPM_BIN=$npm_bin" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }};$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" `
            -DCMAKE_PROGRAM_PATH="${{ env.QT_ROOT_DIR }}/bin;$env:NPM_BIN" `
            -DEPISTEME_NODE_BIN="$env:NPM_BIN"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          windeployqt --release --dir deploy "build\bin\${{ env.APP_NAME }}.exe"

      - name: Copy External Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy/usr/bin | Out-Null
          New-Item -ItemType Directory -Force -Path deploy/usr/share/Lore | Out-Null
          New-Item -ItemType Directory -Force -Path deploy/lib | Out-Null

          Copy-Item "$env:NPM_BIN\node.exe" deploy/usr/bin/
          Copy-Item "$env:NPM_BIN\mmdc.cmd" deploy/usr/bin/
          Copy-Item (Get-Command dot).Source deploy/usr/bin/dot.exe

          if (Test-Path "cmake-build-libs/install/lib") {
            Copy-Item -Recurse "cmake-build-libs/install/lib/*" deploy/lib/
          }
          # DLLs must live next to Lore.exe or on PATH. Copy any .dll
          # from the external install tree into deploy/ as well.
          if (Test-Path "cmake-build-libs/install/bin") {
            Copy-Item "cmake-build-libs/install/bin/*.dll" deploy/ -ErrorAction SilentlyContinue
          }

          if (Test-Path "models") {
            Copy-Item -Recurse models deploy/usr/share/Lore/
          }
          if (Test-Path "external/HeadTTS") {
            Copy-Item -Recurse external/HeadTTS deploy/usr/share/Lore/HeadTTS
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lore-windows-${{ env.BUILD_TYPE }}
          path: deploy/