name: macOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.4.2'
  BUILD_TYPE: Release
  APP_NAME: Lore

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          arch: 'clang_64'
          cache: true
          modules: 'qt5compat qtmultimedia qtpdf qtwebsockets qtwebchannel qttexttospeech'

      - name: Install Homebrew Dependencies
        run: |
          brew update
          brew install ninja cmake quazip faiss graphviz node libomp tree-sitter-cli

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Configure CMake
        run: >
          cmake -S . -B build -G "Ninja"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }};$(brew --prefix);$(brew --prefix quazip);$(brew --prefix faiss)"
          -DCMAKE_PROGRAM_PATH="${{ env.QT_ROOT_DIR }}/bin:$(brew --prefix)/bin"
          -DEPISTEME_NODE_BIN="$(brew --prefix)/bin"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DOpenMP_C_FLAGS="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include"
          -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include"
          -DOpenMP_C_LIB_NAMES="omp"
          -DOpenMP_CXX_LIB_NAMES="omp"
          -DOpenMP_omp_LIBRARY="$(brew --prefix libomp)/lib/libomp.dylib"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Deploy Qt
        run: |
          macdeployqt "build/bin/${{ env.APP_NAME }}.app" -verbose=2

      - name: Copy External Assets into Bundle
        run: |
          APP_BUNDLE="build/bin/${{ env.APP_NAME }}.app"
          RESOURCES_DIR="$APP_BUNDLE/Contents/Resources"
          FRAMEWORKS_DIR="$APP_BUNDLE/Contents/Frameworks"

          mkdir -p "$RESOURCES_DIR/usr/bin"
          mkdir -p "$RESOURCES_DIR/usr/share/Lore"
          mkdir -p "$FRAMEWORKS_DIR"

          cp "$(brew --prefix)/bin/node" "$RESOURCES_DIR/usr/bin/node"
          cp "$(brew --prefix)/bin/mmdc" "$RESOURCES_DIR/usr/bin/mmdc"
          cp "$(brew --prefix)/bin/dot"  "$RESOURCES_DIR/usr/bin/dot"

          if [ -d "cmake-build-libs/install/lib" ]; then
            find cmake-build-libs/install/lib -name '*.dylib' -exec \
              cp {} "$FRAMEWORKS_DIR/" \;
          fi

          if [ -d "models" ]; then
            cp -r models "$RESOURCES_DIR/usr/share/Lore/"
          fi

          if [ -d "external/HeadTTS" ]; then
            cp -r external/HeadTTS "$RESOURCES_DIR/usr/share/Lore/HeadTTS"
          fi

      - name: Create DMG
        run: |
          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder "build/bin/${{ env.APP_NAME }}.app" \
            -ov -format UDZO "${{ env.APP_NAME }}-macos.dmg"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lore-macos-${{ env.BUILD_TYPE }}
          path: ${{ env.APP_NAME }}-macos.dmg